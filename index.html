<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#195b3b">
  <meta name="description" content="Mầm TSA — học hiểu từ nền tảng, luyện tập từng bước và theo dõi tiến bộ thật của bạn.">
  <title>Mầm TSA — Hiểu từ gốc, tiến từng ngày</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23195b3b'/%3E%3Cpath d='M20 30V18M20 23C8 23 10 10 10 10c10 0 11 8 10 13Zm0-4C20 7 31 8 31 8c0 10-5 12-11 11Z' fill='%23d7f692' stroke='%23d7f692' stroke-width='2'/%3E%3C/svg%3E">
  
  
<style>:root {
  color-scheme: light;
  --paper: #f6f6ef;
  --surface: #ffffff;
  --ink: #202b25;
  --muted: #647168;
  --green: #195b3b;
  --green-dark: #12452d;
  --green-soft: #eaf0e5;
  --lime: #d7f692;
  --peach: #f6dfcc;
  --purple: #e7def5;
  --blue: #dce9f2;
  --line: #e3e7de;
  --danger: #a33d35;
  --shadow: 0 10px 35px rgba(32, 43, 37, .045);
  --radius: 22px;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

*, *::before, *::after { box-sizing: border-box; }
html { min-width: 320px; scroll-behavior: smooth; scroll-padding-top: 105px; }
body { margin: 0; color: var(--ink); background: var(--paper); font-size: 15px; line-height: 1.65; }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button, a { touch-action: manipulation; }
button { cursor: pointer; }
button { color: inherit; }
a { color: var(--green); text-underline-offset: 4px; }
a:hover { text-decoration-thickness: 2px; }
button, a, input, select, textarea, summary, [tabindex] { outline-offset: 4px; }
:focus-visible { outline: 3px solid #719e3f; }
button:disabled { opacity: .52; cursor: not-allowed; transform: none !important; }
svg { display: inline-block; flex-shrink: 0; width: 24px; height: 24px; vertical-align: middle; }
img, video, canvas { max-width: 100%; height: auto; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { font-weight: 650; line-height: 1.25; letter-spacing: -.035em; overflow-wrap: anywhere; }
h1 { font-size: clamp(28px, 3.4vw, 44px); }
h2 { font-size: 25px; }
h3 { font-size: 19px; }
h4 { font-size: 16px; }
p + p { margin-top: 12px; }
strong { font-weight: 650; }
small { font-size: 12px; line-height: 1.55; }
ul, ol { margin: 12px 0; padding-left: 23px; }
li + li { margin-top: 7px; }
code { padding: 2px 5px; border-radius: 5px; background: #edf0e8; font-size: .88em; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; top: -80px; left: 16px; z-index: 200; padding: 12px 18px; background: var(--ink); color: white; border-radius: 10px; }
.skip-link:focus { top: 12px; }
.app-shell { min-height: 100dvh; }

/* Navigation */
.sidebar { position: fixed; z-index: 40; inset: 0 auto 0 0; width: 224px; padding: 32px 19px 22px; display: flex; flex-direction: column; background: #fcfcf7; border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 11px; min-height: 46px; padding: 0 13px; margin-bottom: 39px; color: var(--ink); font-size: 24px; font-weight: 750; line-height: 1.15; letter-spacing: -.055em; text-decoration: none; }
.brand svg { width: 35px; height: 35px; color: var(--green); }
.brand-mark { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 13px; background: var(--green); color: var(--lime); }
.brand-mark svg { width: 25px; height: 25px; color: inherit; }
.brand small, .brand-subtitle { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; }
.sidebar nav { display: grid; gap: 7px; }
.nav-label { padding: 0 15px; margin-bottom: 11px; color: #8a958b; font-size: 10px; letter-spacing: .13em; font-weight: 700; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 47px; padding: 11px 14px; border: 0; border-radius: 13px; background: transparent; color: #637066; font-size: 14px; font-weight: 550; text-align: left; text-decoration: none; transition: background .18s, color .18s; }
.nav-item:hover { background: #f0f2e9; color: var(--ink); }
.nav-item.active, .nav-item[aria-current="page"] { color: var(--green); background: #e9efe1; font-weight: 700; }
.nav-icon { display: flex; align-items: center; justify-content: center; width: 22px; flex-shrink: 0; }
.nav-icon svg, .nav-item > svg { width: 20px; height: 20px; stroke-width: 1.8; }
.nav-item .badge { margin-left: auto; }
.sidebar-bottom { display: grid; gap: 16px; margin-top: auto; padding-top: 30px; }
.sidebar-note { padding: 16px; border-radius: 16px; background: #f0f2e8; color: var(--muted); font-size: 12px; }
.sidebar-note strong { display: block; margin-bottom: 6px; color: var(--green); }
.sidebar-footer { padding: 0 14px; color: #8c958a; font-size: 10px; }
.mobile-nav { display: none; }
.main { margin-left: 224px; min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 82px; padding: 17px 36px; border-bottom: 1px solid var(--line); background: rgba(246, 246, 239, .94); -webkit-backdrop-filter: blur(15px); backdrop-filter: blur(15px); }
.topbar-title { font-size: 13px; color: var(--muted); }
.topbar-title strong { color: var(--ink); font-weight: 600; }
.topbar-actions { display: flex; align-items: center; gap: 18px; min-width: 0; }
.topbar .brand { display: none; }
.topbar .icon-btn { background: #fff; }
.avatar, .profile-avatar { display: grid; flex-shrink: 0; place-items: center; width: 39px; height: 39px; border: 1px solid #d6decf; border-radius: 50%; background: #e7eddb; color: var(--green); font-size: 13px; font-weight: 700; }
.page-content { width: 100%; max-width: 1280px; min-width: 0; margin: 0 auto; padding: 35px 36px 56px; }
.page-header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 18px; margin-bottom: 27px; }
.page-header h1 { margin-top: 6px; }
.page-header p { max-width: 680px; margin-top: 10px; color: var(--muted); }
.eyebrow { display: block; color: var(--green); font-size: 10px; font-weight: 750; letter-spacing: .15em; line-height: 1.6; text-transform: uppercase; }
.muted { color: var(--muted); }
.text-small { font-size: 12px; }
.text-green { color: var(--green); }
.text-center { text-align: center; }
.nowrap { white-space: nowrap; }

/* Reusable controls and layout */
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 9px; min-height: 46px; max-width: 100%; padding: 11px 20px; border: 1px solid transparent; border-radius: 11px; color: var(--ink); background: #edf0e6; font-size: 13px; font-weight: 650; line-height: 1.45; text-align: center; text-decoration: none; transition: background .18s, border-color .18s, box-shadow .18s, transform .18s; overflow-wrap: anywhere; }
.btn svg { width: 18px; height: 18px; }
.btn:hover { background: #e4e9db; transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn-primary { color: white; background: var(--green); }
.btn-primary:hover { background: var(--green-dark); box-shadow: 0 4px 12px rgba(25,91,59,.12); }
.btn-secondary { color: var(--ink); border-color: #dce2d6; background: white; }
.btn-secondary:hover { background: #f5f7ef; border-color: #bccab4; }
.btn-ghost { color: var(--green); background: transparent; }
.btn-ghost:hover { background: #e9eee1; }
.btn-danger { color: #9a3830; border-color: #eccfc9; background: #fff7f4; }
.btn-danger:hover { background: #fce9e3; }
.btn-sm { min-height: 44px; padding: 8px 13px; font-size: 12px; }
.btn-block { width: 100%; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; min-width: 44px; min-height: 44px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: transparent; transition: color .18s, background .18s; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:hover { color: var(--green); background: #ecf0e5; }
.row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; min-width: 0; }
.row.between, .space-between { justify-content: space-between; }
.stack { display: grid; gap: 18px; min-width: 0; }
.grid { display: grid; gap: 20px; min-width: 0; }
.split-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; align-items: stretch; gap: 22px; }
.metric-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.content-columns { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.grid > *, .dashboard-grid > *, .split-grid > *, .metric-grid > *, .content-columns > * { min-width: 0; }
.card { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); min-width: 0; }
.card > h2, .card > h3 { margin-bottom: 13px; }
.card + .section-heading { margin-top: 30px; }
.section-heading { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin: 32px 0 18px; }
.section-heading h2 { font-size: 21px; }
.section-heading p { margin-top: 5px; color: var(--muted); font-size: 12px; }
.section-heading .btn { padding-right: 0; }
.badge, .tag, .chip, .domain-tag { display: inline-flex; align-items: center; justify-content: center; gap: 6px; max-width: 100%; padding: 5px 10px; border-radius: 7px; background: #eff2e9; color: var(--green); font-size: 10px; font-weight: 650; line-height: 1.5; letter-spacing: .01em; overflow-wrap: anywhere; }
.badge { min-width: 24px; border-radius: 30px; }
.chip { padding: 6px 11px; border: 1px solid #dfe6d8; border-radius: 30px; background: transparent; }
button.chip { min-height: 44px; }
.domain-tag.math, .tag.green, .badge.green, .chip.green { color: #276143; background: #eaf1df; }
.domain-tag.science, .tag.peach, .badge.peach, .chip.peach { color: #7a5338; background: #f8e9dc; }
.domain-tag.reading, .tag.purple, .badge.purple, .chip.purple { color: #635077; background: #ede7f5; }
.tag.blue, .badge.blue { color: #3c6577; background: #e8f0f6; }
.tag.warning { color: #80652c; background: #fff4d8; }
.tag.danger, .badge.danger { color: #99463b; background: #fcece6; }
.progress-track { width: 100%; height: 7px; overflow: hidden; border-radius: 10px; background: #edf0e7; }
.progress-fill { height: 100%; max-width: 100%; border-radius: inherit; background: var(--green); transition: width .35s ease; }
.progress-fill.lime { background: var(--lime); }
.filter-tabs, .segmented { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-bottom: 22px; }
.filter-tab, .segmented button { display: inline-flex; justify-content: center; align-items: center; gap: 7px; min-height: 44px; padding: 9px 15px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; transition: background .18s, color .18s; }
.filter-tab:hover, .segmented button:hover { background: #e9eee1; }
.filter-tab.active, .filter-tab[aria-selected="true"], .segmented button.active { border-color: #dfe5d7; background: white; color: var(--green); box-shadow: 0 2px 6px rgba(32,43,37,.025); }

/* Today */
.hero-card { position: relative; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(180px, .85fr); align-items: center; gap: 12px; min-height: 323px; overflow: hidden; padding: 34px; border: 0; border-radius: 24px; background: var(--green); color: #fbfcf6; }
.hero-card::after { position: absolute; width: 240px; height: 240px; right: -95px; top: -120px; border: 1px solid rgba(215,246,146,.15); border-radius: 50%; content: ""; pointer-events: none; }
.hero-copy { position: relative; z-index: 1; min-width: 0; }
.hero-copy .eyebrow { color: #c7dda7; font-size: 9px; }
.hero-title { margin-top: 17px; font-size: clamp(30px, 3.1vw, 46px); line-height: 1.14; letter-spacing: -.045em; }
.hero-title em, .hero-accent { color: var(--lime); font-family: Georgia, "Times New Roman", serif; font-weight: 400; letter-spacing: -.04em; }
.hero-copy > p { max-width: 355px; margin-top: 17px; color: #d2e0cf; font-size: 12px; line-height: 1.8; }
.hero-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
.hero-actions .btn-primary, .hero-card .btn-primary { color: #234227; background: var(--lime); }
.hero-actions .btn-primary:hover, .hero-card .btn-primary:hover { background: #e2ffad; }
.hero-actions .btn-ghost, .hero-card .btn-ghost { color: #e2eed8; }
.hero-actions .btn-ghost:hover, .hero-card .btn-ghost:hover { background: rgba(255,255,255,.08); }
.hero-art { position: relative; min-width: 0; display: grid; place-items: center; align-self: stretch; }
.hero-art > svg { width: 100%; max-width: 300px; height: auto; max-height: 270px; overflow: visible; }
.hero-art .orbit { transform-origin: center; }
.hero-caption { margin-top: 14px; color: #cadbc2; font-size: 10px; }
.daily-card { display: flex; flex-direction: column; gap: 17px; padding: 24px; border: 1px solid var(--line); border-radius: 24px; background: white; }
.daily-card h3 { font-size: 17px; }
.daily-card .eyebrow { color: #78816e; font-size: 9px; }
.daily-card .btn { margin-top: auto; }
.daily-plan { display: grid; gap: 13px; }
.daily-plan-item { display: flex; align-items: flex-start; gap: 11px; }
.daily-plan-item .nav-icon { width: 29px; height: 29px; border: 1px solid var(--line); border-radius: 50%; background: #f8f9f3; }
.daily-plan-item p { font-size: 12px; }
.daily-plan-item small { color: var(--muted); font-size: 10px; }
.daily-summary { display: flex; align-items: center; gap: 13px; padding-top: 16px; border-top: 1px solid var(--line); }
.daily-summary strong { display: block; font-size: 24px; line-height: 1.2; letter-spacing: -.04em; }
.stat-card { display: flex; align-items: center; gap: 15px; padding: 21px 22px; min-width: 0; border: 1px solid var(--line); border-radius: 18px; background: white; }
.stat-icon { display: grid; place-items: center; flex-shrink: 0; width: 43px; height: 43px; border-radius: 14px; background: var(--green-soft); color: var(--green); }
.stat-icon.peach { background: var(--peach); color: #775135; }
.stat-icon.purple { background: var(--purple); color: #66517b; }
.stat-card .stat-value, .stat-card strong { display: block; font-size: 24px; line-height: 1.25; letter-spacing: -.045em; }
.stat-card .stat-label, .stat-card p { color: var(--muted); font-size: 11px; }
.stat-card small { color: #72816c; font-size: 10px; }
.stat-card svg { width: 21px; height: 21px; }
.topic-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px; }
.topic-card { display: flex; flex-direction: column; gap: 14px; padding: 23px; min-width: 0; border: 1px solid var(--line); border-radius: 20px; background: white; transition: border-color .18s, box-shadow .18s, transform .18s; }
.topic-card:hover { border-color: #c4d3b6; box-shadow: 0 9px 28px rgba(32,43,37,.055); }
.topic-card h3 { font-size: 17px; line-height: 1.35; }
.topic-card p { color: var(--muted); font-size: 12px; line-height: 1.75; }
.topic-card .topic-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--muted); font-size: 10px; }
.topic-card .topic-meta svg { width: 13px; height: 13px; }
.topic-card .btn { align-self: flex-start; margin-top: auto; padding-left: 0; min-height: 44px; }
.topic-card .topic-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding-top: 10px; border-top: 1px solid #f0f2ea; }
.topic-card .topic-footer .btn { margin: 0; }
.topic-icon { display: grid; align-items: center; justify-content: center; width: 45px; height: 45px; flex-shrink: 0; border-radius: 14px; color: var(--green); background: var(--green-soft); }
.topic-icon svg { width: 25px; height: 25px; }
.topic-icon.peach, .topic-card[data-color="peach"] .topic-icon { color: #8b6244; background: var(--peach); }
.topic-icon.purple, .topic-card[data-color="purple"] .topic-icon { color: #71558b; background: var(--purple); }
.topic-icon.blue, .topic-card[data-color="blue"] .topic-icon { color: #48697d; background: var(--blue); }
.focus-card { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px; padding: 25px 28px; border: 1px solid #dae3ce; border-radius: 20px; background: #ecf1e1; }
.focus-card p { max-width: 630px; margin-top: 6px; color: #5a6a51; font-size: 12px; }
.focus-card h3 { font-size: 18px; }
.study-timer { display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; color: var(--green); font-size: 12px; font-variant-numeric: tabular-nums; }
.study-timer svg { width: 17px; height: 17px; }

/* Roadmap */
.roadmap-phase { position: relative; display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 18px; padding-bottom: 30px; }
.phase-line { position: absolute; left: 20px; top: 38px; bottom: 0; width: 1px; background: #d8e1cf; }
.roadmap-phase:last-child .phase-line { display: none; }
.phase-node { position: relative; z-index: 1; display: grid; align-items: center; justify-content: center; width: 42px; height: 42px; border: 1px solid #cad8bc; border-radius: 50%; background: #e9f0df; color: var(--green); font-size: 13px; font-weight: 700; }
.phase-node.complete { background: var(--green); color: white; border-color: var(--green); }
.phase-body { min-width: 0; }
.phase-body > .row { margin: 7px 0 16px; }
.phase-body > p { margin: 7px 0 17px; color: var(--muted); font-size: 13px; }
.roadmap-phase .topic-grid { gap: 13px; }
.roadmap-phase .topic-card { padding: 18px; }

/* Lessons and assessment */
.lesson-layout { display: grid; grid-template-columns: minmax(0, 1fr) 285px; gap: 24px; align-items: start; }
.lesson-main { min-width: 0; display: grid; gap: 20px; }
.lesson-aside { position: sticky; top: 107px; display: grid; gap: 18px; min-width: 0; }
.lesson-aside .card { padding: 21px; }
.lesson-aside h3 { font-size: 15px; }
.lesson-aside p, .lesson-aside li { font-size: 12px; color: var(--muted); }
.lesson-step { padding: 25px 28px; border: 1px solid var(--line); border-radius: 20px; background: white; }
.lesson-step h2 { margin-bottom: 16px; font-size: 21px; }
.lesson-step h3 { margin-bottom: 12px; }
.lesson-step > p { color: #455346; font-size: 14px; line-height: 1.9; }
.lesson-step .step-number { display: inline-grid; align-items: center; justify-content: center; width: 29px; height: 29px; margin-right: 10px; border: 1px solid #d5e1c8; border-radius: 50%; background: #f1f5e9; color: var(--green); font-size: 12px; vertical-align: middle; }
.visual-panel { position: relative; display: grid; align-items: center; justify-items: center; gap: 16px; min-width: 0; padding: 27px 22px; border: 1px solid #e2e8d8; border-radius: 18px; background: #f3f6ec; overflow: hidden; }
.visual-panel > svg { width: 100%; height: auto; max-height: 300px; }
.visual-panel p { max-width: 490px; text-align: center; font-size: 12px; color: var(--muted); }
.visual-panel input[type="range"] { width: min(100%, 330px); }
.visual-controls { display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; }
.visual-label { color: var(--green); font-size: 13px; font-weight: 650; }
.source-note { padding: 13px 16px; border-left: 2px solid #c9d9b7; color: var(--muted); background: #f3f5ed; font-size: 11px; line-height: 1.7; overflow-wrap: anywhere; }
.question-card { padding: 27px; border: 1px solid var(--line); border-radius: 22px; background: white; min-width: 0; }
.question-card h2 { margin: 16px 0 22px; font-size: 21px; line-height: 1.55; letter-spacing: -.02em; }
.question-card h3 { margin: 14px 0 20px; font-size: 18px; line-height: 1.5; }
.question-context, .reading-passage { margin: 16px 0; padding: 20px; border: 1px solid #e5e7e0; border-radius: 14px; background: #f9faf6; color: #455247; font-size: 14px; line-height: 1.95; white-space: pre-line; }
.question-options, .answer-options { display: grid; gap: 10px; margin: 17px 0 22px; }
.answer-option { position: relative; display: flex; align-items: center; gap: 13px; width: 100%; min-height: 60px; padding: 14px 17px; border: 1px solid #dfe5d8; border-radius: 12px; color: var(--ink); background: white; text-align: left; font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; transition: background .15s, border-color .15s, box-shadow .15s; }
.answer-option:hover:not(:disabled) { border-color: #9fba8a; background: #f7faef; }
.answer-option.selected, .answer-option[aria-pressed="true"], .answer-option:has(input:checked) { border-color: var(--green); background: #eff6e7; box-shadow: 0 0 0 1px var(--green); }
.answer-option.correct { border-color: #76a267; background: #edf6e5; color: #24542b; }
.answer-option.incorrect { border-color: #d3a295; background: #fff2ec; color: #8d4036; }

/* Progress and notebook */
